[package]
name = "xhjob"
version = "0.1.0"
edition = "2021"

[lib]
name = "xhjob"
crate-type = ["cdylib"]

[features]
default = []
persist = ["rusqlite", "aes-gcm"]

[dependencies]
ext-php-rs = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream", "gzip", "deflate", "brotli"] }
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
num_cpus = "1"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
aes-gcm = { version = "0.10", optional = true }
bincode = "1"
encoding_rs = "0.8"
rand = "0.8"
thiserror = "1"
futures-util = "0.3"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "signal", "fs", "user"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Console", "Win32_System_ProcessStatus"] }

[profile.release]
opt-level = 3
lto = true
# Panic in `extern "C"` (ext-php-rs handler) is UB. Switch to abort so the
# process dies cleanly instead of unwinding through C frames. This also makes
# `catch_unwind` calls in pool/thread_pool.rs become no-ops (panics abort
# before they can be caught), which is the desired safe-fail behavior for a
# PHP-FPM daemon: better abort than corrupt state.
panic = "abort"

# Dev/test builds keep panic=unwind so cargo test assertions can report per-test
# instead of aborting the whole test runner.
