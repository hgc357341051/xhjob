[package]
name = "xhjob"
version = "0.1.0"
edition = "2021"

[lib]
name = "xhjob"
crate-type = ["cdylib"]

[features]
default = []
persist = ["rusqlite"]

[dependencies]
ext-php-rs = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
num_cpus = "1"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
bincode = "1"
encoding_rs = "0.8"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
