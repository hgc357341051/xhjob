title: Xhjob
description: PHP 异步任务调度扩展（Rust + ext-php-rs）使用文档
theme: just-the-docs
baseurl: /xhjob
url: https://hgc357341051.github.io

permalink: pretty
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: 返回顶部

# 左侧导航分组顺序通过各文档 front matter 的 nav_order 控制
# 顶级分组用 has_children: true，子页用 parent: <分组标题>
aux_links:
  GitHub 仓库:
    - https://github.com/hgc357341051/xhjob

# Just-The-Docs 颜色方案
color_scheme: light

# Markdown 处理
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 排除构建产物
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
